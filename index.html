<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay Control</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background: #f7f7f7; }
    .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px #0001; max-width: 400px; margin: auto; }
    h1 { font-size: 1.5em; margin-bottom: 1em; }
    button { padding: 12px 24px; margin: 10px 0; font-size: 1em; border: none; border-radius: 4px; cursor: pointer; }
    .on { background: #4caf50; color: #fff; }
    .off { background: #f44336; color: #fff; }
    .status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Relay Control</h1>
    <button class="on" onclick="trigger('on')">Turn ON</button>
    <button class="off" onclick="trigger('off')">Turn OFF</button>
    <div class="status" id="status"></div>
  </div>
  <script>
    async function trigger(action) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = 'Sending...';
      try {
        const res = await fetch(`https://api.facilify.afica/api/v1/relay/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (res.ok) {
          statusDiv.textContent = data.status || 'Success';
        } else {
          statusDiv.textContent = data.message || 'Error';
        }
      } catch (err) {
        statusDiv.textContent = 'Network error';
      }
    }
  </script>
</body>
</html>
